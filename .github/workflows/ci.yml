name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (recorded tool outputs, no containers)
        run: pytest -m "not containers"

  containers:
    # Builds the seven tool images and runs them end to end on tests/data/small.fa.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Build images
        run: metalncrna setup --build-from containers
      - name: Container tests
        run: pytest -m containers
